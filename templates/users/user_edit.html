{% extends "profile/profile_base.html" %}
{% block title %}Upravit uživatele {{ user.email }}{% endblock %}

{% block profile_content %}

  <div class="admin-detail-header">
    <h2>Upravit uživatele {{ user.first_name + " " + user.last_name }}</h2>

    {% if is_admin %}
      <form method="post"
            action="{{ url_for('user_delete', user_id=user.id) }}"
            onsubmit="return confirm('Opravdu chcete tohoto uživatele smazat? Tuto akci nelze vrátit.');"
            style="margin:0">
        <button type="submit" class="btn btn-destructive">
          Smazat uživatele
        </button>
      </form>
    {% endif %}
  </div>

  <div class="admin-detail">
    <form method="post" action="{{ url_for('user_update', user_id=user.id) }}" class="admin-detail-form">
      <div class="admin-detail-form-grid">
        <div class="admin-detail-form-item">
          <label>
            E-mail
            <input type="email" name="email" value="{{ user.email }}" required>
          </label>
        </div>

        <div class="admin-detail-form-item">
          <label>
            Jméno
            <input type="text" name="first_name" value="{{ user.first_name }}" required>
          </label>
        </div>

        <div class="admin-detail-form-item">
          <label>
            Příjmení
            <input type="text" name="last_name" value="{{ user.last_name }}" required>
          </label>
        </div>

        <div class="admin-detail-form-item">
          <label>
            Telefon
            <input type="text" name="phone_number" value="{{ user.phone_number or '' }}">
          </label>
        </div>
      </div>

      <div class="admin-detail-form-actions">
        <button type="submit" class="btn btn-primary">Uložit změny</button>
        <a href="{{ url_for('user_detail', user_id=user.id) }}" class="btn btn-tertiary">Zpět na detail</a>
      </div>
    </form>

    {% if is_admin %}
      <hr class="admin-detail-divider">

      <form method="post" action="{{ url_for('user_change_role', user_id=user.id) }}" class="admin-detail-form">
        <div class="admin-detail-form-grid">
          <div class="admin-detail-form-item">
            <label>
              Role
              <select name="role_id">
                {% for r in roles %}
                  <option value="{{ r.id }}" {% if r.id == user.role_id %}selected{% endif %}>
                    {{ r.id }} – {{ r.name if r.name is defined else r.description if r.description is defined else r.id }}
                  </option>
                {% endfor %}
              </select>
            </label>
          </div>
        </div>

        <div class="admin-detail-form-actions">
          <button type="submit" class="btn btn-secondary">Změnit roli</button>
        </div>
      </form>
    {% endif %}
  </div>

{% endblock %}
