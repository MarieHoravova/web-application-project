{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
  <h2>{{ title }}</h2>

  {% if error %}
    <p style="color: red;">{{ error }}</p>
  {% endif %}

  <form method="post" action="{{ url_for('auth_register_post') }}">
    <label>Jméno:<br><input type="text" name="first_name" required></label><br>
    <label>Příjmení:<br><input type="text" name="last_name" required></label><br>
    <label>Telefon:<br><input type="text" name="phone_number" required></label><br>
    <label>Email:<br><input type="email" name="email" required></label><br>
    <label>Heslo:<br><input type="password" name="password" required></label><br>
    <button type="submit">Registrovat</button>
  </form>

  <p>Už máte účet? <a href="{{ url_for('auth_login') }}">Přihlaste se</a>.</p>
{% endblock %}
