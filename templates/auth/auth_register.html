{% extends "base.html" %}
{% block title %}Registrace{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-container">

    <div class="auth-card">
      <h1>Registrace</h1>

      {% if error %}
        <p class="auth-error">{{ error }}</p>
      {% endif %}

      <form method="post" action="{{ url_for('auth_register_post') }}" class="auth-form">
        <label>
          Jméno
          <input type="text" name="first_name" required>
        </label>
        <label>
          Příjmení
          <input type="text" name="last_name" required>
        </label>
        <label>
          Telefon
          <input type="tel" name="phone_number" required>
        </label>
        <label>
          E-mail
          <input type="email" name="email" required>
        </label>
        <label>
          Heslo
          <input type="password" name="password" required>
        </label>
        <button type="submit" class="btn btn-primary auth-submit">Registrovat</button>
      </form>

      <p class="auth-register">
        Už máte účet?
        <a href="{{ url_for('auth_login') }}">Přihlaste se</a>.
      </p>
    </div>

  </div>
</section>
{% endblock %}
