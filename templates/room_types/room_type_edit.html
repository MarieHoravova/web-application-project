{% extends "profile/profile_base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block profile_content %}

  <div class="dashboard-header" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px;">
    <div>
        <h1 style="margin: 0 0 4px 0;">Upravit typ: {{ room_type.name }}</h1>
    </div>

    {% if is_admin %}
      <form method="post"
            action="{{ url_for('room_type_delete', room_type_id=room_type.id) }}"
            onsubmit="return confirm('Opravdu chcete smazat tento typ pokoje?');"
            style="margin:0">
        <button type="submit" class="btn btn-destructive">Smazat typ</button>
      </form>
    {% endif %}
  </div>

  <div class="form-card">
    <form method="post" action="{{ url_for('room_type_update', room_type_id=room_type.id) }}">
      <div class="detail-grid">

        <div class="detail-item">
          <label class="detail-label">Název typu</label>
          <input type="text" name="name" value="{{ room_type.name }}" required class="form-input">
        </div>

        <div class="detail-item">
          <label class="detail-label">Kapacita (osoby)</label>
          <input type="number" name="capacity" min="1" step="1" value="{{ room_type.capacity }}" required class="form-input">
        </div>

        <div class="detail-item">
          <label class="detail-label">Cena od (Kč / noc)</label>
          <input type="number" name="base_price" step="0.01" min="0" value="{{ room_type.base_price }}" required class="form-input">
        </div>

        <div class="detail-item full-width">
          <label class="detail-label">Popis</label>
          <textarea name="description" rows="4" placeholder="Krátký popis typu pokoje" class="form-input">{{ room_type.description or '' }}</textarea>
        </div>

      </div>

      <div style="margin-top: 24px; display: flex; gap: 12px;">
        <button type="submit" class="btn btn-primary">Uložit změny</button>

        <a href="{{ url_for('room_type_detail', room_type_id=room_type.id) }}" class="btn btn-tertiary">Zrušit</a>
      </div>
    </form>
  </div>

{% endblock %}
