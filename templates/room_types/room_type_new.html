{% extends "profile/profile_base.html" %}
{% block title %}Nový typ pokoje{% endblock %}

{% block profile_content %}

  <div class="dashboard-header" style="margin-bottom: 24px;">
    <h1 style="margin: 0 0 4px 0;">Nový typ pokoje</h1>
    <p style="color: var(--color-text-muted); margin: 0;">Vytvoření nové kategorie pokojů</p>
  </div>

  <div class="form-card">
    <form method="post" action="{{ url_for('room_types_create') }}">
      <div class="detail-grid">

        <div class="detail-item">
          <label class="detail-label">Název typu</label>
          <input type="text" name="name" placeholder="Např. Apartmá Deluxe" required class="form-input">
        </div>

        <div class="detail-item">
          <label class="detail-label">Kapacita (osoby)</label>
          <input type="number" name="capacity" min="1" step="1" placeholder="2" required class="form-input">
        </div>

        <div class="detail-item">
          <label class="detail-label">Cena od (Kč / noc)</label>
          <input type="number" name="base_price" step="0.01" min="0" placeholder="2500" required class="form-input">
        </div>

        <div class="detail-item full-width">
          <label class="detail-label">Popis</label>
          <textarea name="description" rows="4" placeholder="Krátký popis typu pokoje a vybavení..." class="form-input"></textarea>
        </div>

      </div>

      <div style="margin-top: 24px; display: flex; gap: 12px;">
        <button type="submit" class="btn btn-primary">Vytvořit typ</button>
        <a href="{{ url_for('room_types_list') }}" class="btn btn-tertiary">Zrušit</a>
      </div>
    </form>
  </div>

{% endblock %}
