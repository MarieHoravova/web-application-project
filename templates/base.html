<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Hotel App{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=TASA+Orbiter:wght@400..800&display=swap" rel="stylesheet">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <!-- Logo vlevo -->
      <a href="/" class="logo">Hotel App</a>

      <!-- Menu uprostřed -->
      <nav class="main-nav">
        <a href="/">Domů</a>
        <span class="divider">|</span>
        <a href="#galerie">Galerie</a>
        <span class="divider">|</span>
        <a href="#kontakt">Kontakt</a>
      </nav>

      <!-- Tlačítka vpravo -->
     <div class="header-actions">
          {% if current_user is defined and current_user %}
            <a href="{{ url_for('reservation_create_page') }}" class="btn btn-primary">Rezervace</a>
            <a href="{{ url_for('user_profile') }}" class="btn btn-secondary">Můj účet</a>
            <a href="{{ url_for('auth_logout') }}" class="logout-link">Odhlásit</a>
          {% else %}
            <a href="{{ url_for('bookings_list') }}" class="btn btn-primary">Rezervace</a>
            <a href="{{ url_for('auth_login') }}" class="btn btn-secondary">Přihlásit se</a>
          {% endif %}
        </div>

    </div>
  </header>

  <main class="page-main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
