{% extends "profile/profile_base.html" %}
{% block title %}Nový pokoj{% endblock %}

{% block profile_content %}
  <section class="rooms-page">
    <div class="admin-detail">
      <div class="admin-detail-header">
        <h2>Nový pokoj</h2>
        <a href="{{ url_for('rooms_list') }}" class="btn btn-tertiary">← Zpět na seznam pokojů</a>
      </div>

      <form method="post" action="{{ url_for('rooms_create') }}" class="admin-detail-form">
        <div class="admin-detail-form-grid">
          <div class="admin-detail-form-item">
            <label>
              Číslo pokoje
              <input type="number" name="number" required>
            </label>
          </div>

          <div class="admin-detail-form-item">
            <label>
              Typ pokoje
              <select name="room_type_id" required>
                {% for rt in room_types %}
                  <option value="{{ rt.id }}">{{ rt.id }} – {{ rt.name }}</option>
                {% endfor %}
              </select>
            </label>
          </div>

          <div class="admin-detail-form-item">
            <label>
              Status
              <select name="room_status_id" required>
                {% for s in statuses %}
                  <option value="{{ s.id }}">{{ s.id }} – {{ s.description }}</option>
                {% endfor %}
              </select>
            </label>
          </div>

          <div class="admin-detail-form-item">
            <label>
              Patro
              <input type="number" name="floor" value="1" required>
            </label>
          </div>

          <div class="admin-detail-form-item">
            <label>
              Cesta k obrázku
              <input type="text" name="image_path" value="default.jpg" required>
            </label>
          </div>
        </div>

        <div class="admin-detail-form-actions">
          <button type="submit" class="btn btn-primary">Vytvořit pokoj</button>
          <a href="{{ url_for('rooms_list') }}" class="btn btn-tertiary">Zrušit</a>
        </div>
      </form>
    </div>
  </section>
{% endblock %}
